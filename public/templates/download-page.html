<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <style>
    /* Taruh ratusan baris CSS tampilan unduh APK Anda di sini */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #333; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 500px; width: 100%; padding: 30px; text-align: box; box-sizing: border-box; }
    h1 { font-size: 22px; color: #111; margin-bottom: 10px; }
    p { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 25px; }
    .btn-download { display: block; background: #00c853; color: #fff; text-align: center; padding: 14px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 16px; transition: background 0.2s; }
    .btn-download:hover { background: #00b0ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{TITLE}}</h1>
    <p>{{DESCRIPTION}}</p>
    <a href="{{DOWNLOAD_LINK}}" class="btn-download">DOWNLOAD APK RESMI</a>
  </div>
</body>
</html>
